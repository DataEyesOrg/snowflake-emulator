[project]
name = "sfemu"
version = "0.1.0"
description = "Local Snowflake emulator: a wire-compatible server backed by DuckDB"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.4",
    "pytz>=2024.1",
    "sqlglot>=30",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.scripts]
sfemu = "sfemu.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "snowflake-connector-python>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sfemu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning:snowflake"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
